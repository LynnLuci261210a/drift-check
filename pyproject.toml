[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "drift-check"
version = "0.1.0"
description = "Diff live AWS infrastructure state against Terraform configs and report configuration drift."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[ec2,s3]>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "boto3-stubs[ec2,s3]>=1.34",
]

[project.scripts]
drift-check = "drift_check.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drift_check*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["drift_check"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
